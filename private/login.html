<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>دخول الإدارة | </title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',system-ui,sans-serif;background:#0a0803;color:#f3ecdd;min-height:100vh;display:grid;place-items:center;
  background-image:radial-gradient(40% 40% at 20% 10%,rgba(212,174,86,.16),transparent 70%),radial-gradient(40% 40% at 85% 90%,rgba(160,120,40,.12),transparent 70%)}
.card{width:min(92vw,400px);background:rgba(24,19,8,.85);border:1px solid rgba(212,174,86,.35);border-radius:22px;padding:34px 28px;box-shadow:0 0 40px rgba(212,174,86,.12)}
h1{font-size:24px;color:#f7e6bb;text-align:center;margin-bottom:6px}
p.sub{text-align:center;color:#a89f8b;font-size:14px;margin-bottom:24px}
.dbtn{display:block;text-align:center;text-decoration:none;margin-top:10px;padding:14px;border-radius:12px;font-weight:800;font-size:16px;color:#140f04;background:linear-gradient(135deg,#f7e6bb,#d4ae56)}
.err{margin-top:14px;color:#ff8d98;text-align:center;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <img src="/logo.png" alt="" style="display:block;margin:0 auto 12px;width:72px;height:72px;border-radius:50%;object-fit:cover">
  <h1>🔐 لوحة التحكم</h1>
  <p class="sub">Top Store — الدخول لأصحاب رول الإدارة فقط</p>
  <a class="dbtn" href="/auth/discord?next=admin">الدخول عبر ديسكورد</a>
  <div class="err" id="e"></div>
</div>
<script>
if (new URLSearchParams(location.search).has('denied')) {
  document.getElementById('e').textContent = '⛔ حسابك لا يملك رول الإدارة، أو تعذر التحقق منه.';
  history.replaceState(null, '', '/admin');
}
</script>
</body>
</html>
