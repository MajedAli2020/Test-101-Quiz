services:
  - type: web
    name: hp1-quiz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node start.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      # القيم التالية يسألك عنها Render وقت الإنشاء (sync: false)
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ADMIN_ROLE_ID
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
