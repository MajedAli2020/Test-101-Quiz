services:
  - type: web
    name: hp1-quiz
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # الوحيد المطلوب — باقي الإعدادات من لوحة التحكم ← إعدادات خاصة
      - key: DISCORD_BOT_TOKEN
        sync: false
